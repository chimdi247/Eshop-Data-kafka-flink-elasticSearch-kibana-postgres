# Validate the Compose configuration:
# docker compose config

# Build images and start all services:
# docker compose up -d --build

# Check container status:
# docker compose ps

# Follow Kafka UI logs:
# docker compose logs -f kafka-ui

# Service URLs:
# Kafka UI:          http://localhost:8085
# Flink Dashboard:   http://localhost:8081
# Kibana:            http://localhost:5601
# Elasticsearch:     http://localhost:9200

name: flinkcommerce

services:
  broker:
    image: apache/kafka:4.4.0
    container_name: flinkcommerce-broker
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - flinkcommerce

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: flinkcommerce-kafka-init
    depends_on:
      broker:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
    command:
      - "--bootstrap-server"
      - "broker:29092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "financial_transactions"
      - "--partitions"
      - "1"
      - "--replication-factor"
      - "1"
    restart: "no"
    networks:
      - flinkcommerce

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: flinkcommerce-kafka-ui
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: flinkcommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - flinkcommerce

  postgres:
    image: postgres:18.6
    container_name: flinkcommerce-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - flinkcommerce

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    container_name: flinkcommerce-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
      - flinkcommerce

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.12
    container_name: flinkcommerce-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:5601/api/status >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - flinkcommerce

  flink-jobmanager:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flinkcommerce-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/127.0.0.1/8081'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - flinkcommerce

  flink-taskmanager:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flinkcommerce-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    restart: unless-stopped
    networks:
      - flinkcommerce

  flink-job:
    build:
      context: .
      dockerfile: Dockerfile
    image: flinkcommerce-job:1.0.0
    container_name: flinkcommerce-job
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until bash -c 'echo > /dev/tcp/flink-jobmanager/8081' 2>/dev/null; do
          echo "Waiting for Flink JobManager..."
          sleep 3
        done
        echo "Submitting Flink job..."
        flink run -d -m flink-jobmanager:8081 /opt/flink/usrlib/flinkcommerce-job.jar
    restart: "no"
    networks:
      - flinkcommerce

  transaction-generator:
    build:
      context: ./SalesTransactionGenerator
      dockerfile: Dockerfile
    image: flinkcommerce-transaction-generator:1.0.0
    container_name: flinkcommerce-transaction-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_TOPIC: financial_transactions
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-5}
      GENERATOR_DURATION_SECONDS: ${GENERATOR_DURATION_SECONDS:-0}
    restart: unless-stopped
    networks:
      - flinkcommerce

networks:
  flinkcommerce:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  elasticsearch-data:
